# fly.toml app configuration file generated for acneto-api-red-log-1872 on 2026-09-12T17:14:37-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'acneto-api-red-log-1872'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  ADMIN_EMAIL = 'admin@acnetotransportes.com'
  ADMIN_NAME = 'Administrador'
  CORS_ORIGINS = 'https://nextdriver.fly.dev,https://acneto-transportes.fly.dev,http://localhost:5173,http://127.0.0.1:5173'

[[mounts]]
  source = 'ac_neto_api_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '512mb'
  cpus = 2
  memory_mb = 512
