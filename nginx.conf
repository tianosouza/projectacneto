# Servidor do portal (ver Dockerfile da raiz). A API NAO passa por aqui:
# o navegador chama a URL da API diretamente (VITE_API_URL) e o CORS e liberado na API.
server {
  # Deve ser igual a internal_port do fly.toml da raiz.
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Arquivos com hash no nome podem ser cacheados por muito tempo.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Rotas do React (SPA): qualquer caminho desconhecido volta para o index.html.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    try_files $uri /index.html;
  }
}
