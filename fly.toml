# fly.toml app configuration file generated for nextdriver on 2026-09-12T17:39:07-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nextdriver'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  ADMIN_EMAIL = 'admin@acnetotransportes.com'
  ADMIN_NAME = 'Administrador'
  CORS_ORIGINS = 'https://nextdriver.fly.dev,http://localhost:5173,http://127.0.0.1:5173'
  VITE_API_URL = 'https://acneto-api-red-log-1872.fly.dev'

[[mounts]]
  source = 'nextdriver_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 4173
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '512mb'
  cpus = 2
  memory_mb = 512
