# ============================================================================
# DEPLOY DO PORTAL (site) NO FLY.IO  -  PARTE 2 DE 2
# O deploy e SEPARADO: a API (backend) tem app, banco e fly.toml proprios em backend/.
# Faca antes a parte 1 (API): backend/fly.toml. Este arquivo e para rodar na RAIZ do projeto.
#
# PASSO A PASSO (nova conta):
#   1. fly auth login
#   2. Troque `app` abaixo por um nome UNICO para o portal (sera https://<nome>.fly.dev).
#   3. Troque VITE_API_URL abaixo pela URL da API ja publicada (https://<nome-da-api>.fly.dev).
#   4. fly apps create <mesmo-nome-do-portal>
#   5. fly deploy -a <mesmo-nome-do-portal>
#   6. Volte na API e confirme que CORS_ORIGINS (backend/fly.toml) e igual a
#      https://<nome-do-portal>.fly.dev ; se mudar, rode `fly deploy` da API de novo.
#
# Nao precisa de volume nem de segredos: o portal e estatico.
# Se mudar a URL da API, refaca o deploy do portal (a URL e gravada no build).
# ============================================================================

# MUDAR: nome unico do portal na conta do cliente.
app = 'nextdrivertest'

# MUDAR (opcional): regiao (gru = Sao Paulo).
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

  [build.args]
    # MUDAR: URL publica da API (parte 1), sem barra no final. Obrigatorio: o build falha se ficar vazio.
    VITE_API_URL = 'https://nextdrivertesteapi.fly.dev'

[http_service]
  # NAO MUDAR: deve ser igual ao `listen` do nginx.conf.
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '256mb'
  cpus = 1
